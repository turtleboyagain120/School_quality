name: Native Code Analysis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: python  # Change to javascript, java, etc. if needed

      - name: Auto-Scan and Detect Flaws
        uses: github/github-actions-runner@v2
        # If your project requires compilation, add build steps here

      - name: Generate Code Recommendations
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
